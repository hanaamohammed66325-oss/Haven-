[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# PWA headers.
# sw.js must NEVER be long-cached: the browser re-checks it to find updates, so
# a stale copy leaves users pinned to an old app shell with no way to recover.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Icons use stable filenames (no content hash), so keep cache short enough
# that a redesign propagates within a day.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
